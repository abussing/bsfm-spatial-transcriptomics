[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsfm-spatial-transcriptomics"
version = "0.1.0"
description = "Provenance-controlled BSFM preprocessing tools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "h5py>=3.8"]

[project.optional-dependencies]
validation = ["psutil>=5.9"]
production = ["psutil>=5.9", "jsonschema>=4.18"]
initialization = ["numpy==2.1.3", "scipy==1.14.1", "scikit-learn==1.4.2", "joblib==1.4.2", "threadpoolctl==3.5.0"]
sampler-layer1 = ["numpy==2.1.3", "scipy==1.14.1"]
sampler-layer2 = ["jax==0.7.0", "jaxlib==0.7.0", "numpy==2.1.3", "scipy==1.14.1", "ml_dtypes==0.6.0", "opt_einsum==3.4.0", "threadpoolctl==3.5.0"]

[project.scripts]
bsfm-raw-preflight = "bsfm.preprocessing.raw_preflight:main"
bsfm-sct-smoke = "bsfm.preprocessing.sct_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bsfm.preprocessing" = ["sections.json", "*.R"]
